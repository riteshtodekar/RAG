<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAG App — Voyage + Pinecone + Gemini</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>RAG Knowledge Assistant</h1>
      <p class="sub">Voyage AI embeddings · Pinecone vector search · Gemini generation</p>
    </header>

    <section class="card">
      <h2>1. Add knowledge</h2>
      <div class="tabs">
        <button class="tab-btn active" data-tab="text-tab">Paste text</button>
        <button class="tab-btn" data-tab="file-tab">Upload file</button>
      </div>

      <div id="text-tab" class="tab-panel active">
        <textarea id="textInput" placeholder="Paste any text, notes, or documentation here..."></textarea>
        <input id="textSource" type="text" placeholder="Source label (optional, e.g. 'HR policy doc')" />
        <button id="ingestTextBtn">Ingest text</button>
      </div>

      <div id="file-tab" class="tab-panel">
        <input id="fileInput" type="file" accept=".txt,.md,.csv,.pdf" />
        <button id="ingestFileBtn">Upload &amp; ingest</button>
      </div>

      <div id="ingestStatus" class="status"></div>
    </section>

    <section class="card">
      <h2>2. Ask a question</h2>
      <div id="chatLog" class="chat-log"></div>
      <div class="ask-row">
        <input id="questionInput" type="text" placeholder="Ask something about your ingested content..." />
        <button id="askBtn">Ask</button>
      </div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
